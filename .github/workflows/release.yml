name: Release

on:
  push:
    tags:
      - "v*"
  # Release branches provide an auditable bootstrap path when a caller cannot
  # create Git tags directly. Branches named release/v* publish that version.
  create:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "create" ]]; then
            release_tag="${GITHUB_REF_NAME#release/}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bridge-allah/rocksoul-wx/gateway
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'create' && startsWith(github.event.ref, 'release/v') && !contains(steps.release.outputs.tag, '-')) }}
            type=raw,value=${{ steps.release.outputs.tag }},enable=${{ github.event_name == 'create' && startsWith(github.event.ref, 'release/v') }}

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest with keyless OIDC
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE: ghcr.io/bridge-allah/rocksoul-wx/gateway
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "create" ]]; then
            release_tag="${GITHUB_REF_NAME#release/}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          if ! gh release view "${release_tag}" >/dev/null 2>&1; then
            if [[ "${release_tag}" == *-* ]]; then
              gh release create "${release_tag}" --target "${GITHUB_SHA}" --prerelease --generate-notes
            else
              gh release create "${release_tag}" --target "${GITHUB_SHA}" --generate-notes
            fi
          fi

  windows-installer:
    needs: publish
    if: github.event_name == 'push' || (github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'release/v0.2.0')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native Windows gateway
        run: cargo build --release -p wx-gateway

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "create") {
            $releaseTag = $env:GITHUB_REF_NAME -replace "^release/", ""
          } else {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          if (-not $releaseTag.StartsWith("v")) { throw "Release tag must start with v." }
          $version = $releaseTag.Substring(1)
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" "packaging/windows/ROCKSOUL-WX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/windows/ROCKSOUL-WX-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($installer.FullName).sha256", "$hash  $($installer.Name)" + [Environment]::NewLine)

      - name: Attach installer and checksum to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "create") {
            $releaseTag = "v0.2.0"
          } else {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          $installer = Get-ChildItem "dist/windows/ROCKSOUL-WX-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $checksum = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum)) { throw "Installer checksum was not produced." }
          gh release upload $releaseTag $installer.FullName $checksum --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the Windows installer to the GitHub Release." }
