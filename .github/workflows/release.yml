name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bridge-allah/rocksoul-wx/gateway
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest with keyless OIDC
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE: ghcr.io/bridge-allah/rocksoul-wx/gateway
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release create "${GITHUB_REF_NAME}" --prerelease --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

  windows-installer:
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native Windows gateway
        run: cargo build --release -p wx-gateway

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" "packaging/windows/ROCKSOUL-WX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/windows/ROCKSOUL-WX-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($installer.FullName).sha256", "$hash  $($installer.Name)" + [Environment]::NewLine)

      - name: Attach installer and checksum to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/windows/ROCKSOUL-WX-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $checksum = "$($installer.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksum)) { throw "Installer checksum was not produced." }
          gh release upload $env:GITHUB_REF_NAME $installer.FullName $checksum --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the Windows installer to the GitHub Release." }
