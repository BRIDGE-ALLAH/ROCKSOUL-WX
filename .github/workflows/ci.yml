name: Rust CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test core crates and gateway
        run: cargo test --workspace --exclude wx-command-deck

  command-deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check Dioxus web target
        run: cargo check -p wx-command-deck --target wasm32-unknown-unknown

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test gateway on Windows
        run: cargo test -p wx-gateway
      - name: Build native Windows gateway
        run: cargo build --release -p wx-gateway
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $($_.Name)"
            }
          }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          $manifest = Get-Content "Cargo.toml" -Raw
          if ($manifest -notmatch "(?s)\[workspace\.package\]\s+version\s*=\s*`"([^`"]+)`"") {
            throw "Could not read workspace.package.version from Cargo.toml."
          }
          $appVersion = $Matches[1]
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$appVersion" "packaging/windows/ROCKSOUL-WX.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/windows/ROCKSOUL-WX-Setup-$appVersion.exe")) {
            throw "Expected Windows installer output was not produced."
          }

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: WX_API_KEY=ci-only-placeholder-key-at-least-32-characters docker compose config --quiet
      - name: Build gateway container
        run: docker build --tag rocksoul-wx:ci .

      - name: Validate production Compose configuration
        run: |
          mkdir -p secrets config
          printf 'ci-gateway-secret-placeholder-32-characters' > secrets/gateway_api_key
          printf 'ci-provider-secret-placeholder' > secrets/primary_provider_api_key
          printf 'ci-receipt-hmac-ci-placeholder-32-bytes' > secrets/receipt_hmac_key
          cp config/providers.production.example.json config/providers.production.json
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
