[workspace]
resolver = "2"
members = [
    "apps/wx-gateway",
    "apps/wx-command-deck",
    "crates/wx-contract",
    "crates/wx-policy",
    "crates/wx-planner",
    "crates/wx-provider",
    "crates/wx-router",
]
default-members = [
    "apps/wx-gateway",
    "crates/wx-contract",
    "crates/wx-policy",
    "crates/wx-planner",
    "crates/wx-provider",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tower-http = { version = "0.7", features = ["cors", "limit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
