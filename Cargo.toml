[workspace]
resolver = "2"
members = [
    "apps/wx-gateway",
    "apps/wx-command-deck",
    "crates/wx-contract",
    "crates/wx-policy",
    "crates/wx-planner",
]
default-members = [
    "apps/wx-gateway",
    "crates/wx-contract",
    "crates/wx-policy",
    "crates/wx-planner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = { version = "0.8", features = ["json"] }
dioxus = { version = "0.7", default-features = false, features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
